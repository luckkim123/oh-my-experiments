name: Tag Guard

# Separate from ci.yml on purpose (another pending branch touches that file).
# actions/checkout@v4 does NOT fetch tags by default — that's exactly how a
# release commit can land on main with its git tag never pushed and still go
# green. fetch-tags + fetch-depth: 0 make the tag surface actually reachable.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  tag-drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-tags: true
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # `omx-core/tests/conftest.py` has an autouse fixture that imports
      # `omx_core.wiki.hq_backend`, so EVERY test in this file errors at setup
      # when the package is absent. Installing only pytest left this guard red
      # from 2026-08-29 to 2026-09-19 — and a dead tag guard is how 0.16.1
      # reached main with its tag never pushed. It passes on a dev machine
      # either way, because omx_core is already on the path there.
      - run: pip install -e ./omx-core pytest
      - run: python3 -m pytest omx-core/tests/test_tag_drift.py -q
