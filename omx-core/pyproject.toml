[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "omx-core"
version = "0.17.0"
description = "OMX (oh-my-experiments) core: path single-source-of-truth and analysis primitives."
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.0",
    "matplotlib>=3.8",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
# wandb upper bound: the offline reader needs wandb.sdk.internal.datastore and
# wandb.proto.wandb_internal_pb2, both wandb-PRIVATE modules. 0.28.0 has them
# (local, full suite green); 0.30.0 does not, and CI went red the first time a
# runner resolved it. Lifting the bound means porting the reader, not relaxing it.
analyze = ["wandb>=0.18,<0.30", "tensorboard>=2.14"]

[project.scripts]
omx = "omx_core.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["omx_core*"]

[tool.setuptools.package-data]
omx_core = ["reference/**/*.sh"]

[tool.pytest.ini_options]
testpaths = ["tests"]
